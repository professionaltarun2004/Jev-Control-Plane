[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-control-plane"
version = "0.1.0"
description = "A small deterministic control plane around Jev structured decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.7.2"]

[tool.setuptools.packages.find]
where = ["src"]
